  <body>
    <header class="encabezado-recarga">
      <div class="icono-regreso">&lt;</div>
      <h1>Recarga tu saldo</h1>
    </header>

    <div class="contenedor-principal">
      <div class="contenedor-valores">
        <div class="seccion-input">
          <h3 class="titulo-seccion">Ingresa el Valor</h3>
          <button
            class="boton-valor"
            onclick="alert('Botón para ingresar valor clickeado!')"
          >
            $ 5.000
          </button>
        </div>

        <div class="seccion-saldo">
          <h3 class="titulo-seccion">Saldo Actual</h3>
          <div class="saldo-actual">
            <span>$ 10.000</span>
          </div>
        </div>
      </div>

      <div class="contenedor-banco">
        <h3 class="titulo-seccion">¿Desde qué banco quieres recargar?</h3>
        <div class="select-wrapper">
          <select class="select-banco">
            <option value="" disabled selected>Selecciona el banco</option>
            <option value="banco1">Bancolombia</option>
            <option value="banco2">Banco de Bogota</option>
            <option value="banco3">Banco BBVA colombia</option>
            <option value="banco3">Nequi</option>
            <option value="banco3">Daviplata</option>
          </select>
        </div>
      </div>

      <div class="contenedor-autorizacion">
        <label class="checkbox-container">
          <input type="checkbox" />
          <span class="checkmark"></span>
          <center>
            <p>
              <strong
                >Autorizo el tratamiento de datos personales conforme a la ley
                1581 del 2012.</strong
              >
            </p>
          </center>
        </label>
      </div>

      <button
        class="boton-continuar"
        onclick="alert('Botón Continuar clickeado!')"
      >
        Continuar.
      </button>
    </div>
  </body>
